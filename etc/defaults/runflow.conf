# runflow's defaults: every setting, its default value and what it does.
#
# Do not edit this file: it belongs to runflow and changes with it. Copy the
# lines you change into one of these files; they are read after this one, in
# this order, each overriding the ones before:
#   /etc/runflow/runflow.conf          this machine (root)
#   <runflow>/etc/runflow.conf         this installation, the site (not in Git)
#   ~/.config/runflow/runflow.conf     you ($XDG_CONFIG_HOME)
# If RUNFLOW_CONFIG names a file, it replaces those three. Settings in the
# environment and runflow's options override every file (see runflow(1),
# CONFIGURATION).
#
# The files are bash. A list setting, ( ... ), is extended with +=, so that
# a later file keeps what an earlier one set:
#   RUNFLOW_FLOW_VERSIONS+=('dev=~/opm/build/bin')
# while = replaces the whole list. Only their owner (or root) may be able to
# write the files: runflow refuses the others.

# --- Schedulers ---------------------------------------------------------------
# auto: the local queue, localq. LSF, SLURM and PBS are planned: -s slurm
# (lsf, pbs) works with --dry-run only in this release
RUNFLOW_SCHEDULER=auto

# Default queue per scheduler; empty: the scheduler's own default
RUNFLOW_DEFAULT_QUEUE_LSF=''
RUNFLOW_DEFAULT_QUEUE_SLURM=''
RUNFLOW_DEFAULT_QUEUE_PBS=''
RUNFLOW_DEFAULT_QUEUE_LOCALQ=normal        # a label only

# Native options for every job of a scheduler, e.g. '--account=res'.
# localq takes --time=LIMIT, --nice[=N], --job-name=NAME and --exclusive,
# e.g. '--nice' to keep background runs from slowing down interactive work
RUNFLOW_LSF_OPTIONS=''
RUNFLOW_SLURM_OPTIONS=''
RUNFLOW_PBS_OPTIONS=''
RUNFLOW_LOCALQ_OPTIONS=''

# localq slots; empty: the number of CPUs
RUNFLOW_LOCALQ_SLOTS=''

# --- Flow ---------------------------------------------------------------------
# Where Flow versions are searched (as flow<VERSION> or <VERSION>), in order:
# the first OPM Flow found wins; other programs named flow are skipped. PATH
# stands for the directories of $PATH when Flow is looked up (in jobs: after
# RUNFLOW_JOB_SETUP). E.g. a site's versions first, and your builds before
# them:
#   RUNFLOW_FLOW_BIN_PATHS=(/opt/opm/bin PATH)                         site
#   RUNFLOW_FLOW_BIN_PATHS=(~/opm/bin "${RUNFLOW_FLOW_BIN_PATHS[@]}")   you
RUNFLOW_FLOW_BIN_PATHS=(PATH)

# The version @flow and @flowpy use without -v
RUNFLOW_FLOW_VERSION=flow

# Named Flow versions, for builds that share an executable name (e.g. one
# install per version, or a build tree's Debug and Release): 'NAME=PATH'
# items, PATH the executable or its directory (~/ for your home). @flow -v
# NAME uses one; a name wins over the executables found above, and the last
# item of a name wins, so a later file adds names or redefines them with +=:
#   RUNFLOW_FLOW_VERSIONS=('2025.04=/opt/opm/2025.04/bin/flow'
#                          'stable=/opt/opm/2025.04/bin/flow')           site
#   RUNFLOW_FLOW_VERSIONS+=('dev=~/OPM/build/opm-simulators/bin/Release'
#                           'stable=~/opm/patched/bin')                    you
# Define them in a file, not in the environment (bash cannot export lists):
# jobs read them from the configuration.
RUNFLOW_FLOW_VERSIONS=()

# The Flow version whose Python @flowpy uses without -v; empty: the one
# above. E.g. a build with Python bindings, while runs use another
RUNFLOW_FLOWPY_VERSION=''

# Options for every @flow
RUNFLOW_FLOW_OPTIONS=''

# Python of each Flow version: @flow sets PYTHONPATH to its opm bindings when
# Flow embeds Python (PYACTION); @flowpy runs the Python they were built for.
# RUNFLOW_FLOW_PYTHONPATH: where the bindings are.
#   auto   found next to Flow: <prefix>/lib/python3.X/site-packages for
#          <prefix>/bin/flow, or the python/ directories of a build tree
#   a template ({version}, {python}, {prefix} are replaced), e.g.
#          '/opt/opm/{version}/lib/python{python}/site-packages'
#   ''     none: PYTHONPATH is left unchanged
RUNFLOW_FLOW_PYTHONPATH=auto

# Python version per version pattern; wins over detection (the bindings'
# module name, or the libpython Flow is linked against). The last matching
# item wins, so += adds or overrides, e.g. ('flow2024*:3.11' 'flow2025*:3.12')
RUNFLOW_FLOW_PYTHON_MAP=()

# --- MPI ----------------------------------------------------------------------
# Launcher for @mpi outside jobs (LOCAL) and inside jobs of each scheduler;
# {np} is replaced by the number of ranks; empty: LOCAL.
#
# Process binding is left to the MPI library's defaults; set what suits the
# machine. Every mpirun binds from the first core, so runs started side by
# side on one machine (e.g. several localq jobs) share the same cores unless
# binding is off. Open MPI examples (MPICH: -bind-to; Intel MPI: I_MPI_PIN):
#   'mpirun -np {np} --bind-to none'                      runs side by side
#   'mpirun -np {np} --map-by ppr:1:l3cache --bind-to l3cache'
#                                       one rank per chiplet (L3), e.g. AMD EPYC
RUNFLOW_MPI_LAUNCHER_LOCAL='mpirun -np {np}'
RUNFLOW_MPI_LAUNCHER_LOCALQ=''
RUNFLOW_MPI_LAUNCHER_LSF='mpirun -np {np}'
RUNFLOW_MPI_LAUNCHER_SLURM='srun --ntasks={np}'
RUNFLOW_MPI_LAUNCHER_PBS='mpirun -np {np}'

# Launcher options for every @mpi
RUNFLOW_MPI_OPTIONS=''

# --- Jobs ---------------------------------------------------------------------
# Shell commands run at the start of every job; the job fails if they do,
# e.g. 'source /etc/profile.d/modules.sh && module load openmpi opm'
RUNFLOW_JOB_SETUP=''

# --- Waiting for jobs ---------------------------------------------------------
# @wait's time limit in seconds (0: none; the job keeps running when it
# expires); seconds between status checks of schedulers that are polled;
# localq: seconds between scheduling checks, and between checks for dead runners
RUNFLOW_WAIT_TIMEOUT=0
RUNFLOW_POLL=1
RUNFLOW_LOCALQ_POLL=1
RUNFLOW_LOCALQ_REAP_INTERVAL=5

# --- Interactive shells -------------------------------------------------------
# For runflow --shell, or source runflow.bash at a prompt: the marker
# "(runflow SCHEDULER FLOW_VERSION)" before the prompt, and notices of finished
# jobs before the prompt, checked at most every RUNFLOW_NOTIFY_INTERVAL seconds
# (each check asks the schedulers)
RUNFLOW_PROMPT=true
RUNFLOW_NOTIFY=true
RUNFLOW_NOTIFY_INTERVAL=5

# --- Files --------------------------------------------------------------------
# Extension directives: ':'-separated directories or files; later ones
# replace earlier ones' directives of the same name
RUNFLOW_DIRECTIVE_PATH="${XDG_CONFIG_HOME:-$HOME/.config}/runflow/directives"

# Session files, and job logs (empty: $RUNFLOW_STATE_DIR/logs)
RUNFLOW_STATE_DIR="${XDG_STATE_HOME:-$HOME/.local/state}/runflow"
RUNFLOW_LOG_DIR=''

# Debug messages (also: RUNFLOW_DEBUG=true runflow ...)
RUNFLOW_DEBUG=false
