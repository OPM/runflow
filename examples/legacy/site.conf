# What a legacy runflow script hard-codes, as the site's configuration: the
# installation's etc/runflow.conf (see README.md). The paths and names are
# examples: put in your site's.

# Where the Flow versions are: one directory of executables flow2025.10,
# flowrc47, flowdaily, ... (-v flowrc47, or -v rc47, finds one); the default
RUNFLOW_FLOW_BIN_PATHS=(/opt/opm/bin)
RUNFLOW_FLOW_VERSION=flowrc45

# The Python of each version's bindings. runflow finds both by itself when
# the bindings sit next to Flow; a site whose layout it cannot guess says
# where they are, and which Python each version needs (the last matching
# pattern wins: release candidates 47 and later use Python 3.12)
RUNFLOW_FLOW_PYTHONPATH='/opt/opm/lib/python{python}/site-packages/{version}'
RUNFLOW_FLOW_PYTHON_MAP=('flowrc*:3.11' 'flowrc4[7-9]:3.12' 'flowrc[5-9][0-9]:3.12' 'flowdaily:3.11')

# MPI: no process binding (several runs per node), one thread per rank in
# jobs; here and in LSF jobs alike
RUNFLOW_MPI_LAUNCHER_LOCAL='mpirun -np {np} --bind-to none'
RUNFLOW_MPI_LAUNCHER_LSF='mpirun -np {np} --bind-to none -x OMP_NUM_THREADS=1'

# LSF: the default queue, and every job on one host
RUNFLOW_DEFAULT_QUEUE_LSF=normal
RUNFLOW_LSF_OPTIONS='-R span[hosts=1]'
